[package]
name = "memory-kernel"
version = "0.1.0"
edition = "2024"
description = "Generic filesystem-backed entity storage, indexing, search, and workspace coordination"

[lib]
name = "memory_kernel"
path = "src/lib.rs"

[workspace]
members = ["crates/transport-harness"]
resolver = "3"

[features]
## Expose `memory_kernel::testing` — generic sandbox primitives for integration
## tests.  Consumers add this to `[dev-dependencies]` only.
testing = ["dep:criterion"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4", "v5"] }
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled", "unlock_notify"] }
tantivy = "0.22"
notify = "6"
bincode = "1"
sha2 = "0.10"
toon-format = "0.5"
fs4 = "0.11"
globset = "0.4"
tempfile = "3"
tracing = "0.1"
regex = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
criterion = { version = "0.5", optional = true }

# jq query language
jaq-core = "1"
jaq-std = "1"
jaq-interpret = "1"
jaq-syn = "1"

[dev-dependencies]
pretty_assertions = "1"
