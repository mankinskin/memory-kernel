[package]
name = "transport-harness"
version = "0.1.0"
edition = "2024"
description = "Shared CLI, MCP, and HTTP startup scaffolding for workflow domain tools"

[features]
default = []
cli = ["dep:clap"]
mcp = ["dep:rmcp", "dep:tokio"]
http = ["dep:axum", "dep:tokio"]

[dependencies]
axum = { version = "0.8", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
rmcp = { version = "0.14", features = ["server", "transport-io"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["net", "rt"], optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
